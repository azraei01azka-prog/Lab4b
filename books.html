<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q2 - Books from JSON</title>
</head>
<body>

<h2>Books</h2>
<p>First book title: <span id="firstTitle"></span></p>
<p>Second book author: <span id="secondAuthor"></span></p>

<h3>Genres</h3>
<ul id="genreList"></ul>

<p id="errorMessage"></p>

<script>
async function loadBooks() {
  try {
    const response = await fetch("books.json");

    if (!response.ok) {
      throw new Error("Cannot load books.json");
    }

    const data = await response.json();

    document.getElementById("firstTitle").textContent = data.books[0].title;
    document.getElementById("secondAuthor").textContent = data.books[1].author;

    const list = document.getElementById("genreList");
    for (const book of data.books) {
      const li = document.createElement("li");
      li.textContent = book.title + " — " + book.genres.join(", ");
      list.appendChild(li);
    }
  } catch (error) {
    document.getElementById("errorMessage").textContent =
      "Sorry, the book data could not be loaded. Please try again.";
  }
}

loadBooks();
</script>

</body>
</html>
