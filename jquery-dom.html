<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q3 - jQuery DOM</title>
  <style>
    .myStyle { background-color: coral; padding: 16px; }
  </style>
</head>
<body>

<div id="myElement">Original Text</div>

<div id="myDIV"><p>I am a myDIV.</p></div>

<button id="myButton">Click me</button>

<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script>
$(function () {
  // (a) tukar teks
  $("#myElement").text("Modified Text");

  // (b) tambah class
  $("#myDIV").addClass("myStyle");

  // (c) klik button
  $("#myButton").on("click", function () {
    alert("Button clicked!");
  });
});
</script>

</body>
</html>
